name: zapzap
base: core24
adopt-info: zapzap
grade: stable
confinement: strict
icon: share/icons/com.rtosta.zapzap.svg

layout:
  /usr/share/alsa:
    symlink: $SNAP/kf6/usr/share/alsa

apps:
  zapzap:
    command: usr/bin/zapzap
    desktop: usr/share/applications/com.rtosta.zapzap.desktop
    common-id: com.rtosta.zapzap
    extensions: [kde-neon-6]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3.12/dist-packages:$PYTHONPATH
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu-sandbox --password-store=basic
    plugs:
      - audio-record
      - camera
      - home
      - removable-media

plugs:
  shared-memory:
    private: true

parts:
  zapzap:
    plugin: dump
    source: .
    parse-info: [share/metainfo/com.rtosta.zapzap.appdata.xml]
    build-packages:
      - python3-build
      - python3-installer
      - python3-venv
    stage-packages:
      - python3-pyqt6
      - python3-pyqt6.qtwebengine
    override-build: |
      craftctl default
      set -eu

      cd "$CRAFT_PART_SRC"

      . .github/packaging/snap/prepare.sh

      craftctl set version="$(project_version)"

      export DESTDIR="$CRAFT_PART_INSTALL"
      export PREFIX=/usr

      prepare_package

      install -Dm644 \
        share/applications/com.rtosta.zapzap.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.rtosta.zapzap.desktop"

      install -Dm644 \
        share/icons/com.rtosta.zapzap.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/com.rtosta.zapzap.svg"

      install -Dm644 \
        share/metainfo/com.rtosta.zapzap.appdata.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.rtosta.zapzap.appdata.xml"
