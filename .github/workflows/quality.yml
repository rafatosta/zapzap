name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-contract:
    name: Structural documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package manifest
        run: python tests/check_unused_code.py --packages-only

      - name: Validate documented structure
        run: python tests/test_documentation_structure.py -v

      - name: Validate Turkish catalog
        run: python tests/test_turkish_translation.py -v

      - name: Compile Python sources
        run: python -m compileall -q zapzap tests tools run.py

  downloads-cross-platform:
    name: Downloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure headless Qt on Linux
        if: runner.os == 'Linux'
        run: |
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install Qt runtime dependencies
        run: python -m pip install --upgrade PyQt6 PyQt6-WebEngine

      - name: Validate download behavior
        run: python -m unittest discover -s tests -p "test_download_settings.py" -v

      - name: Validate tray behavior
        run: python -m unittest discover -s tests -p "test_taskbar_badge.py" -v

      - name: Validate plain-text paste
        run: python -m unittest discover -s tests -p "test_plain_text_paste.py" -v

      - name: Validate main-window shortcuts
        run: python -m unittest discover -s tests -p "test_main_window_shortcuts.py" -v

      - name: Validate native titlebar theme
        run: python -m unittest discover -s tests -p "test_native_titlebar_theme.py" -v
