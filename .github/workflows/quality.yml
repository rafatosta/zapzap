name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-contract:
    name: Structural documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package manifest
        run: python tests/check_unused_code.py --packages-only

      - name: Validate documented structure
        run: python tests/test_documentation_structure.py -v

      - name: Compile Python sources
        run: python -m compileall -q zapzap backend tests tools run.py

      - name: Test report backend core
        run: python -m unittest discover -s tests/backend -v
